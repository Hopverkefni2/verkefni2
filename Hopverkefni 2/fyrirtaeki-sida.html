<!doctype html>
<html lang="is">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fyrirtæki – TÍNT</title>
    <meta name="description" content="Kynntu þér íslenskt fyrirtæki á TÍNT.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Freeman&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo" aria-label="TÍNT – forsíða">TÍNT</a>

        <form class="search" role="search" action="fyrirtaeki.html" method="get">
          <label for="search-input" class="visually-hidden">Leita að fyrirtækjum</label>
          <i data-lucide="search" aria-hidden="true"></i>
          <input id="search-input" name="leit" type="search" autocomplete="off" placeholder="Leitaðu að fyrirtækjum, vörum eða flokkum...">
        </form>

        <nav class="nav" aria-label="Aðalvalmynd">
          <a href="index.html#flokkar" class="nav-link">Flokkar</a>
          <a href="favorites.html" class="nav-link">Uppáhald <i data-lucide="heart" aria-hidden="true"></i></a>
        </nav>
      </div>
    </header>

    <main class="container biz-page">
      <div id="biz-root">
        <section aria-labelledby="biz-title">
          <div class="biz-title-row">
            <h1 id="biz-title" class="heading-1"></h1>
            <button type="button" class="fav-heart biz-heart" id="biz-heart" aria-pressed="false"><i data-lucide="heart" aria-hidden="true"></i></button>
          </div>
          <ul class="biz-tags" id="biz-tags" aria-label="Flokkar og upplýsingar"></ul>
        </section>

        <div class="biz-main">
          <div class="biz-gallery">
            <img class="biz-img-large" id="biz-img-main" src="" alt="">
            <div class="biz-img-row">
              <img id="biz-img-1" src="" alt="">
              <img id="biz-img-2" src="" alt="">
            </div>
          </div>

          <div class="biz-info">
            <h2 class="page-title">Um fyrirtækið</h2>
            <p class="body-text" id="biz-about"></p>

            <div class="biz-links">
              <a href="#" class="btn biz-visit" id="biz-website" target="_blank" rel="noopener">Heimsækja vefsíðu <i data-lucide="external-link" aria-hidden="true"></i></a>
              <div class="biz-social">
                <a href="#" class="biz-social-link" id="biz-instagram">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/></svg>
                  Instagram
                </a>
                <a href="#" class="biz-social-link" id="biz-facebook">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M16 8h-2a2 2 0 0 0-2 2v11"/><path d="M9 13h6"/></svg>
                  Facebook
                </a>
              </div>
            </div>

            <div class="biz-details">
              <h3 class="biz-details-title">Upplýsingar</h3>
              <div class="biz-details-cols">
                <div class="biz-details-col">
                  <p class="label biz-strong">Staðsetning</p>
                  <address class="small" id="biz-address"></address>
                </div>
                <div class="biz-details-col">
                  <p class="label biz-strong">Opnunartími</p>
                  <p class="small" id="biz-hours"></p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <section class="biz-reviews" aria-labelledby="reviews-title">
          <h2 id="reviews-title" class="page-title">Umsagnir</h2>
          <div class="biz-rating">
            <span class="biz-stars" id="biz-rating-stars" role="img"></span>
            <span class="body-text" id="biz-rating-value"></span>
            <button type="button" class="small biz-rating-link" id="biz-rating-count"></button>
            <span class="small" id="biz-rating-empty" hidden>Engar umsagnir enn</span>
          </div>
          <div class="biz-review-grid" id="biz-reviews"></div>
          <button type="button" class="btn-secondary" id="reviews-toggle" aria-expanded="false" aria-controls="biz-reviews" hidden></button>
        </section>

        <section class="review-form-section" aria-labelledby="review-form-title">
          <h2 id="review-form-title" class="page-title review-form-title">Skrifa umsögn</h2>
          <p class="review-success body-text" id="review-success" role="status" aria-live="polite" hidden></p>
          <div class="apply-box review-box">
            <form id="review-form" class="apply-form" novalidate>
              <div class="field">
                <label for="review-name">Nafn*</label>
                <input id="review-name" name="name" type="text" required maxlength="40" autocomplete="name" aria-describedby="review-name-error">
                <p class="field-error" id="review-name-error" hidden></p>
              </div>
              <fieldset class="field" id="review-rating-field" aria-describedby="review-rating-error">
                <legend>Einkunn*</legend>
                <div class="star-picker">
                  <div class="star-picker-stars" id="review-stars">
                    <input class="star-input visually-hidden" type="radio" name="rating" id="review-star-1" value="1">
                    <label class="star-label" for="review-star-1"><span class="visually-hidden">1 stjarna</span><i data-lucide="star" aria-hidden="true"></i></label>
                    <input class="star-input visually-hidden" type="radio" name="rating" id="review-star-2" value="2">
                    <label class="star-label" for="review-star-2"><span class="visually-hidden">2 stjörnur</span><i data-lucide="star" aria-hidden="true"></i></label>
                    <input class="star-input visually-hidden" type="radio" name="rating" id="review-star-3" value="3">
                    <label class="star-label" for="review-star-3"><span class="visually-hidden">3 stjörnur</span><i data-lucide="star" aria-hidden="true"></i></label>
                    <input class="star-input visually-hidden" type="radio" name="rating" id="review-star-4" value="4">
                    <label class="star-label" for="review-star-4"><span class="visually-hidden">4 stjörnur</span><i data-lucide="star" aria-hidden="true"></i></label>
                    <input class="star-input visually-hidden" type="radio" name="rating" id="review-star-5" value="5">
                    <label class="star-label" for="review-star-5"><span class="visually-hidden">5 stjörnur</span><i data-lucide="star" aria-hidden="true"></i></label>
                  </div>
                  <span class="label" id="review-rating-text" aria-live="polite"></span>
                </div>
                <p class="field-error" id="review-rating-error" hidden></p>
              </fieldset>
              <div class="field">
                <label for="review-text">Umsögn*</label>
                <textarea id="review-text" name="text" required minlength="10" maxlength="500" data-min-message="Umsögnin þarf að vera að minnsta kosti 10 stafir" aria-describedby="review-text-error review-text-count"></textarea>
                <p class="small review-count" id="review-text-count">0/500</p>
                <p class="field-error" id="review-text-error" hidden></p>
              </div>
              <button type="submit" class="btn review-submit">Birta umsögn <span aria-hidden="true">→</span></button>
            </form>
          </div>
        </section>
      </div>

      <div class="fav-empty" id="biz-notfound" hidden>
        <h1 class="section-heading">Fyrirtækið fannst ekki</h1>
        <a href="fyrirtaeki.html" class="btn">Skoða öll fyrirtæki <i data-lucide="arrow-right" aria-hidden="true"></i></a>
      </div>
    </main>

    <footer class="site-footer">
      <a href="saekja-um.html" class="pill">Sækja um</a>
      <a href="hafa-samband.html" class="pill">Hafa samband</a>
    </footer>
  </body>
</html>
